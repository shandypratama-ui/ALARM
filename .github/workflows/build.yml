name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Salin semua MP3 (root repo atau 1 folder di dalamnya) ke assets
        run: |
          mkdir -p app/src/main/assets/sounds
          find . -maxdepth 2 -iname '*.mp3' -not -path './app/*' -exec cp -v {} app/src/main/assets/sounds/ \;
          echo "MP3 yang masuk ke APK:"
          ls -la app/src/main/assets/sounds

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AlarmBangun-APK
          path: app/build/outputs/apk/debug/app-debug.apk
